<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Seed is Growing - Piano Score by Rongjin Yu</title>
    <script src="https://www.verovio.org/javascript/latest/verovio-toolkit-wasm.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/midi-player-js@2.0.16/browser/midiplayer.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: #faf8f5;
            color: #333;
            min-height: 100vh;
            -webkit-text-size-adjust: 100%;
        }

        header {
            text-align: center;
            padding: 2.5rem 1rem 1.2rem;
            background: linear-gradient(135deg, #f5f0e8, #e8e0d0);
            border-bottom: 1px solid #d4c9b8;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 400;
            letter-spacing: 0.08em;
            color: #2c2c2c;
            margin-bottom: 0.3rem;
        }

        header .composer {
            font-size: 1.05rem;
            color: #666;
            font-style: italic;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.6rem;
            padding: 0.7rem 0.5rem;
            background: #fff;
            border-bottom: 1px solid #e0d8cc;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            flex-wrap: wrap;
        }

        .controls button, .controls a.btn {
            padding: 0.5rem 1.2rem;
            font-size: 0.95rem;
            font-family: inherit;
            border: 1px solid #b0a48e;
            background: #fff;
            color: #333;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            white-space: nowrap;
        }

        .controls button:hover, .controls a.btn:hover {
            background: #f0ebe3;
        }

        .controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .controls button.playing {
            background: #e8ddd0;
            border-color: #8a7e6e;
        }

#status {
            font-size: 0.8rem;
            color: #888;
            min-width: 60px;
            text-align: center;
        }

        #score-container {
            max-width: 1000px;
            margin: 1.5rem auto;
            padding: 0 0.5rem;
        }

        #score-container svg {
            width: 100%;
            height: auto;
            display: block;
            margin-bottom: 0.5rem;
        }

        /* Note highlighting via CSS class */
        .note-highlight *[fill] { fill: #c0392b !important; }
        .note-highlight { color: #c0392b; }

        .loading {
            text-align: center;
            padding: 4rem 1rem;
            color: #999;
            font-size: 1.1rem;
        }

        .loading .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #ddd;
            border-top-color: #8a7e6e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        footer {
            text-align: center;
            padding: 1.5rem 1rem;
            color: #aaa;
            font-size: 0.8rem;
            border-top: 1px solid #e0d8cc;
            margin-top: 1.5rem;
        }

        footer a { color: #8a7e6e; }

        /* --- Mobile --- */
        @media (max-width: 768px) {
            header {
                padding: 1.5rem 0.8rem 1rem;
            }

            header h1 {
                font-size: 1.5rem;
                letter-spacing: 0.04em;
            }

            header .composer {
                font-size: 0.9rem;
            }

            .controls {
                gap: 0.4rem;
                padding: 0.5rem;
            }

            .controls button, .controls a.btn {
                padding: 0.45rem 0.8rem;
                font-size: 0.82rem;
            }

#status {
                font-size: 0.72rem;
                width: 100%;
                order: 10;
            }

            #score-container {
                margin: 0.8rem auto;
                padding: 0 0.3rem;
            }

            footer {
                font-size: 0.72rem;
                padding: 1rem;
            }
        }

        @media (max-width: 400px) {
            header h1 {
                font-size: 1.25rem;
            }

            .controls button, .controls a.btn {
                padding: 0.4rem 0.6rem;
                font-size: 0.75rem;
            }

        }
    </style>
</head>
<body>
    <header>
        <h1>Seed is Growing</h1>
        <p class="composer">Composed by Rongjin Yu</p>
    </header>

    <div class="controls">
        <button id="btn-play" disabled>&#9654; Play</button>
        <button id="btn-stop" disabled>&#9632; Stop</button>
<a class="btn" href="Seed_is_growing.pdf" download>&#128196; PDF</a>
        <span id="status">Loading...</span>
    </div>

    <div id="score-container">
        <div class="loading">
            <div class="spinner"></div>
            <p>Loading score...</p>
        </div>
    </div>

    <footer>
        &copy; Rongjin Yu. Licensed under <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank">CC BY 4.0</a>. Score rendered with Verovio.
    </footer>

    <script>
        // --- State ---
        let vrvToolkit = null;
        let midiBase64 = null;
        let isPlaying = false;
        let audioContext = null;
        let piano = null;
        let midiPlayer = null;
        let playingNodes = [];
        let playStartTime = 0;
        let animFrameId = null;
        let midiOriginalTempo = 120;
        let totalSongTimeMs = 0;
        let lastHighlightedIds = [];

        // --- UI Elements ---
        const btnPlay = document.getElementById('btn-play');
        const btnStop = document.getElementById('btn-stop');
        const statusEl = document.getElementById('status');
        const scoreContainer = document.getElementById('score-container');

        // --- Initialize Verovio + Piano ---
        async function loadScoreAndPiano() {
            try {
                statusEl.textContent = 'Loading score...';
                const response = await fetch('Seed_is_growing_edited.musicxml');
                if (!response.ok) throw new Error('Failed to fetch MusicXML file');
                const musicxml = await response.text();

                vrvToolkit.setOptions({
                    pageWidth: 1200,
                    pageMarginLeft: 40,
                    pageMarginRight: 40,
                    pageMarginTop: 40,
                    pageMarginBottom: 40,
                    scale: 50,
                    adjustPageHeight: true,
                    breaks: 'auto',
                    font: 'Bravura',
                    header: 'none',
                    footer: 'none'
                });

                vrvToolkit.loadData(musicxml);
                const totalPages = vrvToolkit.getPageCount();

                scoreContainer.innerHTML = '';
                for (let i = 1; i <= totalPages; i++) {
                    const wrapper = document.createElement('div');
                    wrapper.innerHTML = vrvToolkit.renderToSVG(i);
                    scoreContainer.appendChild(wrapper);
                }

                midiBase64 = vrvToolkit.renderToMIDI();

                // Load piano soundfont
                statusEl.textContent = 'Loading piano...';
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                piano = await Soundfont.instrument(audioContext, 'acoustic_grand_piano');

                statusEl.textContent = 'Ready';
                btnPlay.disabled = false;
            } catch (err) {
                console.error('Error loading:', err);
                scoreContainer.innerHTML = '<p class="loading">Error: ' + err.message + '</p>';
                statusEl.textContent = 'Error';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            statusEl.textContent = 'Loading Verovio...';
            verovio.module.onRuntimeInitialized = () => {
                vrvToolkit = new verovio.toolkit();
                loadScoreAndPiano();
            };
        });

        // --- Playback ---
        btnPlay.addEventListener('click', () => {
            if (isPlaying) return;
            play();
        });

        btnStop.addEventListener('click', () => {
            stop();
        });

        function play() {
            if (!midiBase64 || !piano) return;

            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }

            isPlaying = true;
            btnPlay.disabled = true;
            btnPlay.classList.add('playing');
            btnStop.disabled = false;

            // Set up MIDI player for audio events
            midiPlayer = new MidiPlayer.Player();

            midiPlayer.on('midiEvent', (event) => {
                if (!isPlaying) return;
                if (event.name === 'Note on' && event.velocity > 0) {
                    const node = piano.play(event.noteNumber, audioContext.currentTime, {
                        gain: event.velocity / 127 * 2,
                        duration: 2.5
                    });
                    playingNodes.push(node);
                }
            });

            midiPlayer.on('endOfFile', () => {
                stop();
            });

            // Load MIDI (use original tempo from the score)
            midiPlayer.loadDataUri('data:audio/midi;base64,' + midiBase64);
            midiOriginalTempo = midiPlayer.tempo || 120;

            // Record play start and begin
            playStartTime = performance.now();
            midiPlayer.play();

            // Start highlight loop using requestAnimationFrame
            highlightLoop();
        }

        function highlightLoop() {
            if (!isPlaying) return;

            const elapsedMs = performance.now() - playStartTime;

            // Scale elapsed time to Verovio's MIDI timeline
            // Verovio's getElementsAtTime expects ms in the original MIDI tempo timeline
            // If user plays at different tempo, we need to scale
            const verovioTimeMs = elapsedMs;

            // Update time display
            statusEl.textContent = `Playing... ${formatTime(elapsedMs / 1000)}`;

            // Get elements at current time
            try {
                const elements = vrvToolkit.getElementsAtTime(verovioTimeMs);

                // Only update DOM if highlighted notes changed
                const newIds = (elements && elements.notes) ? elements.notes : [];
                const changed = newIds.length !== lastHighlightedIds.length ||
                    newIds.some((id, i) => id !== lastHighlightedIds[i]);

                if (changed) {
                    // Clear previous
                    lastHighlightedIds.forEach(id => {
                        const el = document.getElementById(id);
                        if (el) el.classList.remove('note-highlight');
                    });

                    // Highlight current
                    newIds.forEach(id => {
                        const el = document.getElementById(id);
                        if (el) el.classList.add('note-highlight');
                    });

                    // Scroll to first highlighted note
                    if (newIds.length > 0) {
                        const firstEl = document.getElementById(newIds[0]);
                        if (firstEl) {
                            const rect = firstEl.getBoundingClientRect();
                            const viewH = window.innerHeight;
                            // Only scroll if note is outside visible area
                            if (rect.top < 80 || rect.bottom > viewH - 40) {
                                firstEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            }
                        }
                    }

                    lastHighlightedIds = newIds;
                }
            } catch(e) {}

            animFrameId = requestAnimationFrame(highlightLoop);
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function stop() {
            isPlaying = false;
            btnPlay.disabled = false;
            btnPlay.classList.remove('playing');
            btnStop.disabled = true;
            statusEl.textContent = 'Ready';

            if (animFrameId) {
                cancelAnimationFrame(animFrameId);
                animFrameId = null;
            }

            if (midiPlayer) {
                midiPlayer.stop();
                midiPlayer = null;
            }

            playingNodes.forEach(node => {
                try { node.stop(); } catch(e) {}
            });
            playingNodes = [];

            // Clear highlights
            lastHighlightedIds.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.remove('note-highlight');
            });
            lastHighlightedIds = [];
        }
    </script>
</body>
</html>
