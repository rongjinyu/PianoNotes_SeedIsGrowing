<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seed is Growing - Piano Score by Rongjin Yu</title>
    <script src="https://www.verovio.org/javascript/latest/verovio-toolkit-wasm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/midi-player-js@2.0.16/browser/midiplayer.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: #faf8f5;
            color: #333;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 3rem 1rem 1.5rem;
            background: linear-gradient(135deg, #f5f0e8, #e8e0d0);
            border-bottom: 1px solid #d4c9b8;
        }

        header h1 {
            font-size: 2.4rem;
            font-weight: 400;
            letter-spacing: 0.08em;
            color: #2c2c2c;
            margin-bottom: 0.4rem;
        }

        header .composer {
            font-size: 1.1rem;
            color: #666;
            font-style: italic;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: #fff;
            border-bottom: 1px solid #e0d8cc;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            flex-wrap: wrap;
        }

        .controls button, .controls a.btn {
            padding: 0.6rem 1.6rem;
            font-size: 1rem;
            font-family: inherit;
            border: 1px solid #b0a48e;
            background: #fff;
            color: #333;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .controls button:hover, .controls a.btn:hover {
            background: #f0ebe3;
        }

        .controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .controls button.playing {
            background: #e8ddd0;
            border-color: #8a7e6e;
        }

        .tempo-control {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.9rem;
            color: #666;
        }

        .tempo-control input[type="range"] {
            width: 100px;
            accent-color: #8a7e6e;
        }

        #status {
            font-size: 0.85rem;
            color: #888;
            min-width: 80px;
            text-align: center;
        }

        #score-container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        #score-container svg {
            width: 100%;
            height: auto;
            display: block;
            margin-bottom: 1rem;
        }

        .loading {
            text-align: center;
            padding: 4rem;
            color: #999;
            font-size: 1.1rem;
        }

        .loading .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #ddd;
            border-top-color: #8a7e6e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: #aaa;
            font-size: 0.85rem;
            border-top: 1px solid #e0d8cc;
            margin-top: 2rem;
        }

        footer a {
            color: #8a7e6e;
        }

        @media (max-width: 600px) {
            header h1 { font-size: 1.6rem; }
            header .composer { font-size: 0.95rem; }
            .controls { gap: 0.5rem; }
            .controls button, .controls a.btn { padding: 0.5rem 1rem; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Seed is Growing</h1>
        <p class="composer">Composed by Rongjin Yu</p>
    </header>

    <div class="controls">
        <button id="btn-play" disabled>&#9654; Play</button>
        <button id="btn-stop" disabled>&#9632; Stop</button>
        <div class="tempo-control">
            <label for="tempo">Tempo:</label>
            <input type="range" id="tempo" min="40" max="200" value="100">
            <span id="tempo-val">100</span>
        </div>
        <a class="btn" href="Seed_is_growing.pdf" download>&#128196; Download PDF</a>
        <span id="status">Loading...</span>
    </div>

    <div id="score-container">
        <div class="loading">
            <div class="spinner"></div>
            <p>Loading score...</p>
        </div>
    </div>

    <footer>
        &copy; Rongjin Yu. Licensed under <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank">CC BY 4.0</a>. Score rendered with Verovio.
    </footer>

    <script>
        // --- State ---
        let vrvToolkit = null;
        let midiBase64 = null;
        let isPlaying = false;
        let audioContext = null;
        let piano = null;
        let midiPlayer = null;
        let playingNodes = [];

        // --- UI Elements ---
        const btnPlay = document.getElementById('btn-play');
        const btnStop = document.getElementById('btn-stop');
        const tempoSlider = document.getElementById('tempo');
        const tempoVal = document.getElementById('tempo-val');
        const statusEl = document.getElementById('status');
        const scoreContainer = document.getElementById('score-container');

        tempoSlider.addEventListener('input', () => {
            tempoVal.textContent = tempoSlider.value;
        });

        // --- Initialize Verovio + Piano ---
        async function init() {
            try {
                statusEl.textContent = 'Loading Verovio...';
                const VerovioModule = await verovio.module;
                vrvToolkit = new verovio.toolkit();

                statusEl.textContent = 'Loading score...';
                const response = await fetch('Seed_is_growing_edited.musicxml');
                if (!response.ok) throw new Error('Failed to fetch MusicXML file');
                const musicxml = await response.text();

                vrvToolkit.setOptions({
                    pageWidth: 1200,
                    pageMarginLeft: 40,
                    pageMarginRight: 40,
                    pageMarginTop: 40,
                    pageMarginBottom: 40,
                    scale: 50,
                    adjustPageHeight: true,
                    breaks: 'auto',
                    font: 'Bravura'
                });

                vrvToolkit.loadData(musicxml);
                const totalPages = vrvToolkit.getPageCount();

                // Render all pages
                scoreContainer.innerHTML = '';
                for (let i = 1; i <= totalPages; i++) {
                    const wrapper = document.createElement('div');
                    wrapper.innerHTML = vrvToolkit.renderToSVG(i);
                    scoreContainer.appendChild(wrapper);
                }

                // Generate MIDI
                midiBase64 = vrvToolkit.renderToMIDI();

                // Load piano soundfont
                statusEl.textContent = 'Loading piano...';
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                piano = await Soundfont.instrument(audioContext, 'acoustic_grand_piano');

                statusEl.textContent = 'Ready';
                btnPlay.disabled = false;
            } catch (err) {
                console.error('Error loading:', err);
                scoreContainer.innerHTML = '<p class="loading">Error: ' + err.message + '</p>';
                statusEl.textContent = 'Error';
            }
        }

        if (typeof verovio !== 'undefined') {
            init();
        } else {
            window.addEventListener('load', init);
        }

        // --- Playback with midi-player-js + soundfont-player ---
        btnPlay.addEventListener('click', () => {
            if (isPlaying) return;
            play();
        });

        btnStop.addEventListener('click', () => {
            stop();
        });

        function play() {
            if (!midiBase64 || !piano) return;

            // Resume audio context if suspended (browser autoplay policy)
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }

            isPlaying = true;
            btnPlay.disabled = true;
            btnPlay.classList.add('playing');
            btnStop.disabled = false;

            // Set up MIDI player
            midiPlayer = new MidiPlayer.Player();

            const tempo = parseInt(tempoSlider.value);

            midiPlayer.on('midiEvent', (event) => {
                if (!isPlaying) return;

                // Note On
                if (event.name === 'Note on' && event.velocity > 0) {
                    const node = piano.play(event.noteNumber, audioContext.currentTime, {
                        gain: event.velocity / 127 * 2,
                        duration: 2
                    });
                    playingNodes.push(node);
                }

                // Note Off
                if (event.name === 'Note off' || (event.name === 'Note on' && event.velocity === 0)) {
                    // soundfont-player handles decay naturally
                }
            });

            midiPlayer.on('playing', (currentTick) => {
                if (!isPlaying) return;

                // Update time display
                const songTime = currentTick.getSongTime ? currentTick.getSongTime() : 0;
                const totalTime = midiPlayer.getSongTime ? midiPlayer.getSongTime() : 0;
                statusEl.textContent = `Playing... ${formatTime(songTime)} / ${formatTime(totalTime)}`;

                // Highlight notes using Verovio's timing
                try {
                    const timeMs = songTime * 1000;
                    const elements = vrvToolkit.getElementsAtTime(timeMs);

                    // Clear previous highlights
                    document.querySelectorAll('.note-highlight').forEach(el => {
                        el.classList.remove('note-highlight');
                        el.querySelectorAll('*').forEach(c => { c.style.fill = ''; });
                    });

                    if (elements && elements.notes) {
                        elements.notes.forEach(id => {
                            const el = document.getElementById(id);
                            if (el) {
                                el.classList.add('note-highlight');
                                el.querySelectorAll('*').forEach(c => {
                                    c.style.fill = '#c0392b';
                                });
                                // Scroll into view if needed
                                el.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
                            }
                        });
                    }
                } catch(e) {}
            });

            midiPlayer.on('endOfFile', () => {
                stop();
            });

            // Load and play
            midiPlayer.loadDataUri('data:audio/midi;base64,' + midiBase64);
            midiPlayer.tempo = tempo;
            midiPlayer.play();
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function stop() {
            isPlaying = false;
            btnPlay.disabled = false;
            btnPlay.classList.remove('playing');
            btnStop.disabled = true;
            statusEl.textContent = 'Ready';

            if (midiPlayer) {
                midiPlayer.stop();
                midiPlayer = null;
            }

            // Stop all sounding notes
            playingNodes.forEach(node => {
                try { node.stop(); } catch(e) {}
            });
            playingNodes = [];

            // Clear highlights
            document.querySelectorAll('.note-highlight').forEach(el => {
                el.classList.remove('note-highlight');
                el.querySelectorAll('*').forEach(c => { c.style.fill = ''; });
            });
        }
    </script>
</body>
</html>
