<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seed is Growing - Piano Score by Rongjin Yu</title>
    <script src="https://www.verovio.org/javascript/latest/verovio-toolkit-wasm.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/svg2pdf.js/2.2.4/svg2pdf.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: #faf8f5;
            color: #333;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 3rem 1rem 1.5rem;
            background: linear-gradient(135deg, #f5f0e8, #e8e0d0);
            border-bottom: 1px solid #d4c9b8;
        }

        header h1 {
            font-size: 2.4rem;
            font-weight: 400;
            letter-spacing: 0.08em;
            color: #2c2c2c;
            margin-bottom: 0.4rem;
        }

        header .composer {
            font-size: 1.1rem;
            color: #666;
            font-style: italic;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: #fff;
            border-bottom: 1px solid #e0d8cc;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            flex-wrap: wrap;
        }

        .controls button {
            padding: 0.6rem 1.6rem;
            font-size: 1rem;
            font-family: inherit;
            border: 1px solid #b0a48e;
            background: #fff;
            color: #333;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .controls button:hover {
            background: #f0ebe3;
        }

        .controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .controls button.playing {
            background: #e8ddd0;
            border-color: #8a7e6e;
        }

        .tempo-control {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.9rem;
            color: #666;
        }

        .tempo-control input[type="range"] {
            width: 100px;
            accent-color: #8a7e6e;
        }

        #status {
            font-size: 0.85rem;
            color: #888;
            min-width: 80px;
            text-align: center;
        }

        #score-container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        #score-container svg {
            width: 100%;
            height: auto;
            display: block;
            margin-bottom: 1rem;
        }

        .loading {
            text-align: center;
            padding: 4rem;
            color: #999;
            font-size: 1.1rem;
        }

        .loading .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #ddd;
            border-top-color: #8a7e6e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: #aaa;
            font-size: 0.85rem;
            border-top: 1px solid #e0d8cc;
            margin-top: 2rem;
        }

        @media (max-width: 600px) {
            header h1 { font-size: 1.6rem; }
            header .composer { font-size: 0.95rem; }
            .controls { gap: 0.5rem; }
            .controls button { padding: 0.5rem 1rem; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Seed is Growing</h1>
        <p class="composer">Composed by Rongjin Yu</p>
    </header>

    <div class="controls">
        <button id="btn-play" disabled>&#9654; Play</button>
        <button id="btn-stop" disabled>&#9632; Stop</button>
        <div class="tempo-control">
            <label for="tempo">Tempo:</label>
            <input type="range" id="tempo" min="40" max="200" value="100">
            <span id="tempo-val">100</span>
        </div>
        <button id="btn-pdf" disabled>&#128196; Download PDF</button>
        <span id="status">Loading...</span>
    </div>

    <div id="score-container">
        <div class="loading">
            <div class="spinner"></div>
            <p>Loading score...</p>
        </div>
    </div>

    <footer>
        &copy; Rongjin Yu. Score rendered with Verovio.
    </footer>

    <script>
        // --- State ---
        let vrvToolkit = null;
        let midiData = null;
        let isPlaying = false;
        let audioContext = null;
        let scheduledNotes = [];
        let startTime = 0;
        let animationFrame = null;
        let midiEvents = [];
        let totalPages = 0;
        let svgPages = [];

        // --- UI Elements ---
        const btnPlay = document.getElementById('btn-play');
        const btnStop = document.getElementById('btn-stop');
        const btnPdf = document.getElementById('btn-pdf');
        const tempoSlider = document.getElementById('tempo');
        const tempoVal = document.getElementById('tempo-val');
        const statusEl = document.getElementById('status');
        const scoreContainer = document.getElementById('score-container');

        tempoSlider.addEventListener('input', () => {
            tempoVal.textContent = tempoSlider.value;
        });

        // --- Initialize Verovio ---
        async function initVerovio() {
            try {
                statusEl.textContent = 'Loading Verovio...';

                // Wait for the WASM module
                const VerovioModule = await verovio.module;
                vrvToolkit = new verovio.toolkit();

                statusEl.textContent = 'Loading score...';

                const response = await fetch('Seed_is_growing_edited.musicxml');
                if (!response.ok) throw new Error('Failed to fetch MusicXML file');
                const musicxml = await response.text();

                vrvToolkit.setOptions({
                    pageWidth: 1200,
                    pageMarginLeft: 40,
                    pageMarginRight: 40,
                    pageMarginTop: 40,
                    pageMarginBottom: 40,
                    scale: 50,
                    adjustPageHeight: true,
                    breaks: 'auto',
                    font: 'Bravura'
                });

                vrvToolkit.loadData(musicxml);
                totalPages = vrvToolkit.getPageCount();

                // Render all pages
                scoreContainer.innerHTML = '';
                svgPages = [];
                for (let i = 1; i <= totalPages; i++) {
                    const svgStr = vrvToolkit.renderToSVG(i);
                    svgPages.push(svgStr);
                    const wrapper = document.createElement('div');
                    wrapper.innerHTML = svgStr;
                    scoreContainer.appendChild(wrapper);
                }

                // Generate MIDI for playback
                midiData = vrvToolkit.renderToMIDI();
                parseMidi(midiData);

                statusEl.textContent = 'Ready';
                btnPlay.disabled = false;
                btnPdf.disabled = false;
            } catch (err) {
                console.error('Error loading score:', err);
                scoreContainer.innerHTML = '<p class="loading">Error loading score: ' + err.message + '</p>';
                statusEl.textContent = 'Error';
            }
        }

        // Start loading once Verovio script is ready
        if (typeof verovio !== 'undefined') {
            initVerovio();
        } else {
            // Wait for script to load
            window.addEventListener('load', initVerovio);
        }

        // --- PDF Download ---
        btnPdf.addEventListener('click', async () => {
            if (!vrvToolkit || totalPages === 0) return;
            btnPdf.disabled = true;
            statusEl.textContent = 'Generating PDF...';

            try {
                const { jsPDF } = window.jspdf;

                // Re-render with print-quality settings
                vrvToolkit.setOptions({
                    pageWidth: 2100,
                    pageHeight: 2970,
                    pageMarginLeft: 100,
                    pageMarginRight: 100,
                    pageMarginTop: 100,
                    pageMarginBottom: 100,
                    scale: 40,
                    adjustPageHeight: false,
                    breaks: 'auto',
                    font: 'Bravura'
                });
                vrvToolkit.loadData(vrvToolkit.getMEI());

                const pdfPages = vrvToolkit.getPageCount();
                const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

                for (let i = 1; i <= pdfPages; i++) {
                    if (i > 1) doc.addPage();
                    const svgStr = vrvToolkit.renderToSVG(i);

                    // Parse SVG string to DOM element
                    const parser = new DOMParser();
                    const svgDoc = parser.parseFromString(svgStr, 'image/svg+xml');
                    const svgEl = svgDoc.documentElement;

                    await doc.svg(svgEl, { x: 0, y: 0, width: 210, height: 297 });
                }

                doc.save('Seed_is_Growing_-_Rongjin_Yu.pdf');

                // Restore screen rendering options
                vrvToolkit.setOptions({
                    pageWidth: 1200,
                    pageMarginLeft: 40,
                    pageMarginRight: 40,
                    pageMarginTop: 40,
                    pageMarginBottom: 40,
                    scale: 50,
                    adjustPageHeight: true,
                    breaks: 'auto',
                    font: 'Bravura'
                });

                statusEl.textContent = 'Ready';
            } catch (err) {
                console.error('PDF generation error:', err);
                statusEl.textContent = 'PDF error - try again';
            }
            btnPdf.disabled = false;
        });

        // --- Simple MIDI parser (base64 -> note events) ---
        function parseMidi(base64Midi) {
            const binary = atob(base64Midi);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            midiEvents = extractNoteEvents(bytes);
        }

        function extractNoteEvents(bytes) {
            let pos = 0;

            // Read header
            if (String.fromCharCode(...bytes.slice(0, 4)) !== 'MThd') return [];
            pos = 8;
            const format = (bytes[pos] << 8) | bytes[pos + 1]; pos += 2;
            const numTracks = (bytes[pos] << 8) | bytes[pos + 1]; pos += 2;
            const ticksPerQuarter = (bytes[pos] << 8) | bytes[pos + 1]; pos += 2;

            let globalEvents = [];
            for (let t = 0; t < numTracks; t++) {
                if (pos + 8 > bytes.length) break;
                const trackHeader = String.fromCharCode(...bytes.slice(pos, pos + 4));
                pos += 4;
                if (trackHeader !== 'MTrk') break;
                const trackLen = (bytes[pos] << 24) | (bytes[pos+1] << 16) | (bytes[pos+2] << 8) | bytes[pos+3];
                pos += 4;
                const trackEnd = pos + trackLen;

                let tick = 0;
                let lastStatus = 0;

                while (pos < trackEnd && pos < bytes.length) {
                    let delta = 0;
                    let b;
                    do {
                        b = bytes[pos++];
                        delta = (delta << 7) | (b & 0x7f);
                    } while (b & 0x80 && pos < trackEnd);
                    tick += delta;

                    let statusByte = bytes[pos];
                    if (statusByte & 0x80) {
                        lastStatus = statusByte;
                        pos++;
                    } else {
                        statusByte = lastStatus;
                    }

                    const eventType = statusByte & 0xf0;
                    const channel = statusByte & 0x0f;

                    if (eventType === 0x90 || eventType === 0x80) {
                        const note = bytes[pos++];
                        const velocity = bytes[pos++];
                        if (eventType === 0x90 && velocity > 0) {
                            globalEvents.push({ type: 'on', tick, note, velocity, channel });
                        } else {
                            globalEvents.push({ type: 'off', tick, note, channel });
                        }
                    } else if (eventType === 0xa0) { pos += 2; }
                    else if (eventType === 0xb0) { pos += 2; }
                    else if (eventType === 0xc0) { pos += 1; }
                    else if (eventType === 0xd0) { pos += 1; }
                    else if (eventType === 0xe0) { pos += 2; }
                    else if (statusByte === 0xff) {
                        const metaType = bytes[pos++];
                        let len = 0;
                        do {
                            b = bytes[pos++];
                            len = (len << 7) | (b & 0x7f);
                        } while (b & 0x80 && pos < trackEnd);
                        pos += len;
                    } else if (statusByte === 0xf0 || statusByte === 0xf7) {
                        let len = 0;
                        do {
                            b = bytes[pos++];
                            len = (len << 7) | (b & 0x7f);
                        } while (b & 0x80 && pos < trackEnd);
                        pos += len;
                    }
                }
                pos = trackEnd;
            }

            const secondsPerTick = 60.0 / (120 * ticksPerQuarter);
            globalEvents.forEach(e => { e.time = e.tick * secondsPerTick; });
            globalEvents.sort((a, b) => a.time - b.time || (a.type === 'off' ? -1 : 1));
            return globalEvents;
        }

        // --- Piano synth using Web Audio API ---
        function createPianoNote(ctx, frequency, velocity, time, duration) {
            const gain = ctx.createGain();
            const osc1 = ctx.createOscillator();
            const osc2 = ctx.createOscillator();

            osc1.type = 'triangle';
            osc1.frequency.value = frequency;
            osc2.type = 'sine';
            osc2.frequency.value = frequency * 2;

            const vol = (velocity / 127) * 0.3;
            gain.gain.setValueAtTime(0, time);
            gain.gain.linearRampToValueAtTime(vol, time + 0.01);
            gain.gain.setValueAtTime(vol, time + Math.max(0.01, duration - 0.1));
            gain.gain.exponentialRampToValueAtTime(0.001, time + duration + 0.3);

            osc1.connect(gain);
            osc2.connect(gain);
            gain.connect(ctx.destination);

            osc1.start(time);
            osc1.stop(time + duration + 0.4);
            osc2.start(time);
            osc2.stop(time + duration + 0.4);

            return { osc1, osc2, gain };
        }

        function midiToFreq(note) {
            return 440 * Math.pow(2, (note - 69) / 12);
        }

        // --- Playback ---
        btnPlay.addEventListener('click', () => {
            if (isPlaying) return;
            play();
        });

        btnStop.addEventListener('click', () => {
            stop();
        });

        function play() {
            if (midiEvents.length === 0) return;

            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            isPlaying = true;
            btnPlay.disabled = true;
            btnPlay.classList.add('playing');
            btnStop.disabled = false;
            statusEl.textContent = 'Playing...';

            const tempoRatio = 100 / parseInt(tempoSlider.value);

            const noteMap = {};
            const notes = [];
            midiEvents.forEach(e => {
                const key = `${e.note}-${e.channel}`;
                if (e.type === 'on') {
                    noteMap[key] = e;
                } else if (e.type === 'off' && noteMap[key]) {
                    const onEvent = noteMap[key];
                    notes.push({
                        note: onEvent.note,
                        velocity: onEvent.velocity,
                        start: onEvent.time * tempoRatio,
                        duration: (e.time - onEvent.time) * tempoRatio
                    });
                    delete noteMap[key];
                }
            });

            startTime = audioContext.currentTime;
            const totalDuration = notes.reduce((max, n) => Math.max(max, n.start + n.duration), 0);

            notes.forEach(n => {
                createPianoNote(
                    audioContext,
                    midiToFreq(n.note),
                    n.velocity,
                    startTime + n.start,
                    Math.max(0.05, n.duration)
                );
            });

            trackPlayback(totalDuration, tempoRatio);

            setTimeout(() => {
                if (isPlaying) stop();
            }, (totalDuration + 1) * 1000);
        }

        function trackPlayback(totalDuration, tempoRatio) {
            const tick = () => {
                if (!isPlaying) return;
                const elapsed = audioContext.currentTime - startTime;
                const progress = Math.min(elapsed / totalDuration, 1);
                statusEl.textContent = `Playing... ${formatTime(elapsed)} / ${formatTime(totalDuration)}`;

                try {
                    const timeMs = (elapsed / tempoRatio) * 1000;
                    const elements = vrvToolkit.getElementsAtTime(timeMs);
                    document.querySelectorAll('.note-highlight').forEach(el => {
                        el.classList.remove('note-highlight');
                        el.style.fill = '';
                    });
                    if (elements && elements.notes) {
                        elements.notes.forEach(id => {
                            const el = document.getElementById(id);
                            if (el) {
                                el.classList.add('note-highlight');
                                el.querySelectorAll('*').forEach(child => {
                                    child.style.fill = '#c0392b';
                                });
                            }
                        });
                    }
                } catch(e) {}

                if (progress < 1) {
                    animationFrame = requestAnimationFrame(tick);
                }
            };
            animationFrame = requestAnimationFrame(tick);
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function stop() {
            isPlaying = false;
            btnPlay.disabled = false;
            btnPlay.classList.remove('playing');
            btnStop.disabled = true;
            statusEl.textContent = 'Ready';

            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
                animationFrame = null;
            }

            document.querySelectorAll('.note-highlight').forEach(el => {
                el.classList.remove('note-highlight');
                el.querySelectorAll('*').forEach(child => {
                    child.style.fill = '';
                });
            });

            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            scheduledNotes = [];
        }
    </script>
</body>
</html>
